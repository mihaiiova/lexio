name: CI

on:
  push:
    branches-ignore: [master, staging]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test

  build-web:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: lexio-web
          path: build/web

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: flutter pub get
      - name: Build AAB (unsigned, for verification)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: lexio-android-aab
          path: build/app/outputs/bundle/release/*.aab
