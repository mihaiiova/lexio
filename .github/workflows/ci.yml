name: CI

on:
  push:
    branches-ignore: [master, staging]
  pull_request:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
      - name: Check Android version-code calculation
        run: bash scripts/test_android_version_code.sh
      - name: Validate content
        run: python3 scripts/validate_content.py
      - name: Verify content bundle is in sync
        run: |
          python3 scripts/generate_content_bundle.py
          if [ -n "$(git status --porcelain content_public/)" ]; then
            echo "Generated content bundle is out of sync with canonical content."
            echo "Run: python3 scripts/generate_content_bundle.py --bump"
            git status --porcelain content_public/
            exit 1
          fi

  build-web:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: lexio-web
          path: build/web

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: flutter pub get
      - name: Build AAB (unsigned, for verification)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: lexio-android-aab
          path: build/app/outputs/bundle/release/*.aab
