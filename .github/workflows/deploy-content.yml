name: Deploy exercise content

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  content-pages:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content and deployment configuration
        env:
          CONTENT_PAGES_URL: ${{ vars.CONTENT_PAGES_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CONTENT_PAGES_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 scripts/validate_content.py
          python3 scripts/generate_content_bundle.py --base-url "$CONTENT_PAGES_URL"
      - name: Publish content to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: content_public
