name: lexio
description: "Slove — Beautiful word games in Romanian."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.1
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: NoticiaText
      fonts:
        - asset: assets/fonts/NoticiaText-Regular.ttf
          weight: 400
        - asset: assets/fonts/NoticiaText-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NoticiaText-Bold.ttf
          weight: 700
        - asset: assets/fonts/NoticiaText-BoldItalic.ttf
          weight: 700
          style: italic

  assets:
    - lib/content/
    - data/common_error_pairs.json
    - data/hyphenation_pairs.json
